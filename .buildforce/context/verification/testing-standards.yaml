id: testing-standards
name: Testing Standards
type: verification
source: extracted
created: "2026-02-02"
last_updated: "2026-02-20"

quality_standards:
  - standard: "Three-tier automated test suite with vitest"
    description: |
      The project uses vitest v4 as the test framework with a three-tier strategy:
      - Unit tests (tests/unit/): Pure function tests with mocked dependencies
      - Integration tests (tests/integration/): Real filesystem operations with temp dirs
      - E2E tests (tests/e2e/): Full CLI execution against built dist/cli.js
      All tiers run in CI across Node.js 18, 20, and 22.
    enforcement: strict
    confidence: 1.0

  - standard: "TypeScript strict mode"
    description: |
      TypeScript is configured with strict: true, noImplicitReturns: true, and
      noFallthroughCasesInSwitch: true. This provides compile-time type safety
      as the primary form of static analysis.
    enforcement: strict
    confidence: 1.0

  - standard: "Coverage thresholds enforced in CI"
    description: |
      vitest coverage via v8 provider with thresholds:
      - Statements: 30%, Branches: 25%, Functions: 30%, Lines: 30%
      Coverage runs on Node.js 20 in CI. Excludes types, constants, agent config,
      scripts, and templates from coverage calculation.
    enforcement: strict
    confidence: 1.0

test_expectations:
  unit_tests:
    when_required: |
      Pure utility functions, data transformations, validation logic,
      any exported function that can be tested without filesystem or network I/O.
    patterns: |
      Vitest with describe/it blocks. Use vi.mock() for dependencies.
      Located in tests/unit/ mirroring src/ directory structure.
      Examples: settings-merge.test.ts, config.test.ts, git.test.ts,
      agent-normalize.test.ts, tools.test.ts, text-format.test.ts,
      migrations-index.test.ts, migrations-v20-helpers.test.ts, runner.test.ts
  integration_tests:
    when_required: |
      Commands that interact with filesystem, config I/O, migration execution,
      agent settings merge with real file creation.
    patterns: |
      Vitest with real filesystem via createTempDir()/cleanupTempDir() helpers.
      Located in tests/integration/ organized by feature area.
      Examples: config-io.test.ts, settings-merge.test.ts,
      v20-migration.test.ts, v21-migration.test.ts, runner-full.test.ts,
      init-validation.test.ts, upgrade-validation.test.ts
  e2e_tests:
    when_required: |
      Full CLI command execution, verifying real user-facing behavior.
      Must build first (npm run build) since tests run against dist/cli.js.
    patterns: |
      Vitest with execSync calling "node dist/cli.js" with real arguments.
      Use local artifact ZIPs (AdmZip) for init/upgrade tests.
      Located in tests/e2e/. Examples: init.test.ts, check.test.ts, upgrade.test.ts
  migration_testing:
    when_required: |
      When modifying src/commands/upgrade/migrations/*.ts
      When adding new migrations (v3.0, etc.)
      When changing MigrationRunner behavior
    patterns: |
      AUTOMATED TESTS EXIST for migrations at two levels:

      Unit tests (tests/unit/commands/upgrade/):
      - runner.test.ts: MigrationRunner register, sort, run, error handling
      - migrations-index.test.ts: compareVersions, getTodayDate
      - migrations-v20-helpers.test.ts: toKebabCase, getItemName, sectionToSubType,
        convertToNewConvention, formatYamlValue

      Integration tests (tests/integration/migrations/):
      - v20-migration.test.ts: Full v2.0 migration with real filesystem
      - v21-migration.test.ts: Full v2.1 migration with real filesystem
      - runner-full.test.ts: Complete v1.0 → v2.0 → v2.1 migration path

      These cover: version detection, skip behavior, error handling,
      full migration paths, idempotency, and convention file generation.

test_infrastructure:
  framework: "vitest v4"
  config_file: "vitest.config.ts"
  setup_file: "tests/setup.ts"
  setup_behavior: |
    Global setup mocks process.exit() to throw instead of terminating
    the test runner. Tests expecting process.exit can catch the known error.
  helpers:
    - "tests/helpers/temp-dir.ts: createTempDir() / cleanupTempDir() for test isolation"
    - "tests/helpers/fixtures.ts: createAgentTemplate() / createBuildforceConfig() builders"
    - "tests/helpers/yaml-builders.ts: createV1IndexYaml() / createV2IndexYaml() / createDomainIndexYaml() / createGuidelinesYaml()"
  npm_scripts:
    - "npm test: vitest run (all tiers)"
    - "npm run test:unit: vitest run tests/unit"
    - "npm run test:integration: vitest run tests/integration"
    - "npm run test:e2e: vitest run tests/e2e"
    - "npm run test:coverage: vitest run --coverage"
    - "npm run test:watch: vitest (watch mode)"

known_risks:
  - module: "src/templates/**/*.ts"
    risk: "Templates (skills, agents, hooks) are not covered by automated tests"
    mitigation: |
      Skill and agent templates are interpreted by AI agents at runtime and
      cannot be meaningfully unit tested. Manual workflow testing is still
      recommended for template changes.
    occurrences: 0
    last_flagged: "2026-02-20"

  - module: "tests/e2e/*.test.ts"
    risk: "E2E tests require prior build step"
    mitigation: |
      E2E tests run against dist/cli.js. If build is stale, tests may pass
      or fail based on old code. CI pipeline runs build before e2e step.
      Locally, run npm run build before npm run test:e2e.
    occurrences: 0
    last_flagged: "2026-02-20"
