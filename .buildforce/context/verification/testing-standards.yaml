id: testing-standards
name: Testing Standards
type: verification
source: extracted
created: "2026-02-02"
last_updated: "2026-02-17"

quality_standards:
  - standard: "No automated tests exist"
    description: |
      This project currently has NO automated testing infrastructure.
      The package.json test script explicitly returns an error: "Error: no test specified".
      All verification must be done manually through local execution and manual review.
    enforcement: reference
    confidence: 1.0

  - standard: "TypeScript strict mode"
    description: |
      TypeScript is configured with strict: true, noImplicitReturns: true, and
      noFallthroughCasesInSwitch: true. This provides compile-time type safety
      as the primary form of static analysis.
    enforcement: strict
    confidence: 1.0

test_expectations:
  unit_tests:
    when_required: "Not currently implemented - no test framework exists"
    patterns: "N/A - tests need to be added"
  integration_tests:
    when_required: "Not currently implemented"
    patterns: "N/A - tests need to be added"
  e2e_tests:
    when_required: "Not currently implemented"
    patterns: "N/A - tests need to be added"
  migration_testing:
    when_required: |
      When modifying src/commands/upgrade/migrations/*.ts
      When adding new migrations (v3.0, etc.)
      When changing MigrationRunner behavior
    patterns: |
      NO AUTOMATED TESTS EXIST for migrations. Manual verification required:
      
      1. Version detection test:
         - Create test .buildforce/context with specific version
         - Run upgrade, verify correct migrations apply
         
      2. Skip behavior test:
         - Run upgrade on already-migrated content
         - Verify "skipped" status and no changes
         
      3. Error handling test:
         - Corrupt a migration target (e.g., invalid YAML)
         - Verify graceful failure with helpful error message
         - Verify upgrade continues for other steps
         
      4. Full migration path test:
         - Start with v1.0 context structure
         - Run upgrade through v2.0 → v2.1
         - Verify all files moved/created correctly
         
      Testing commands:
        npm run build         # Must compile
        npm run dev -- upgrade --dry-run  # Preview changes
        npm run dev -- upgrade  # Real execution

known_risks:
  - module: "src/**/*.ts"
    risk: "No automated test coverage exists for any module"
    mitigation: |
      Manual testing required before merge. Run `npm run dev` to test changes locally.
      Build verification via `npm run build` ensures TypeScript compilation succeeds.
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: "package.json"
    risk: "Test script is a placeholder that always fails"
    mitigation: |
      Do not run `npm test` expecting it to validate changes.
      Use manual verification and TypeScript build checks instead.
    occurrences: 0
    last_flagged: "2026-02-02"
