id: known-risks
name: Known Risks
type: verification
source: extracted
created: "2026-02-02"
last_updated: "2026-02-19"

quality_standards:
  - standard: "Risk awareness documentation"
    description: |
      This file documents known risks, gaps, and areas requiring extra attention.
      Agents should reference this before making changes to affected modules.
    enforcement: reference
    confidence: 1.0

known_risks:
  - module: "src/**/*.ts"
    risk: "No automated test coverage"
    mitigation: |
      All code changes must be manually verified. When making changes:
      1. Run `npm run build` to verify TypeScript compilation
      2. Run `npm run dev` to test the CLI locally
      3. Test affected commands manually in a real project
      Testing infrastructure is a known gap - contributions welcome.
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: "src/**/*.ts"
    risk: "No linting enforcement"
    mitigation: |
      No ESLint or Prettier configuration at project level.
      Code style consistency relies on TypeScript strict mode and manual review.
      Consider running IDE-level linting during development.
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: ".github/workflows/release.yml"
    risk: "Automatic release on main branch pushes"
    mitigation: |
      Merging to main automatically creates a new release if key paths are modified.
      This is intentional for rapid iteration but means:
      - Every merge should be release-ready
      - Version bumping is automatic (patch increment)
      - Breaking changes require manual version management
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: "package.json"
    risk: "Node.js 18+ requirement not enforced in CI"
    mitigation: |
      engines.node specifies >=18.0.0 but no CI check validates this.
      Development should target Node.js 18 as minimum supported version.
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: "src/commands/**/*.ts"
    risk: "No error boundary or crash reporting"
    mitigation: |
      CLI commands may fail without helpful error messages in edge cases.
      When encountering errors, check:
      - File permissions
      - Network connectivity (for GitHub operations)
      - Valid project structure
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: "src/commands/upgrade/migrations/**/*.ts"
    risk: "Forward-only migrations with no rollback support"
    mitigation: |
      Migration system is intentionally forward-only (no rollback).
      Key behaviors to understand:
      1. MigrationRunner stops on FIRST failure (runner.ts:135)
      2. Partial migrations can occur if a migration fails mid-way
      3. Failed migrations leave files in intermediate state
      4. Re-running upgrade will skip already-applied migrations (version check)
      
      When troubleshooting failed migrations:
      - Check _index.yaml version field for current state
      - Review error messages in upgrade output
      - Manual cleanup may be needed for partially-migrated content
      - Consider backup before running migrations on production context
    occurrences: 0
    last_flagged: "2026-02-17"

  - module: "src/commands/upgrade/execution.ts"
    risk: "Migration failures are non-blocking (graceful degradation)"
    mitigation: |
      Context migration errors do NOT fail the upgrade command.
      See execution.ts:421-427 - errors are logged but upgrade continues.
      
      This means:
      - Agent/skill files update even if context migration fails
      - Users may have mismatched versions between agents and context
      - Always check migration step output for "skipped" or warnings
      
      This is INTENTIONAL design: better to have updated agents with
      old context than to block critical security/feature updates.
    occurrences: 0
    last_flagged: "2026-02-17"

  - module: "src/commands/upgrade/migrations/*.ts"
    risk: "No automated test coverage for migrations"
    mitigation: |
      Migration code has zero test coverage. Changes to migrations are
      HIGH RISK because:
      - They modify user's context files permanently
      - Failures may leave files in corrupt state
      - No automated verification of migration correctness
      
      Before modifying migration code:
      1. Create backup of a real .buildforce/context folder
      2. Test full v1.0 → v2.1 path manually
      3. Test re-running migrations (should skip cleanly)
      4. Verify error paths with corrupted inputs
      
      Consider adding integration tests as future improvement.
    occurrences: 0
    last_flagged: "2026-02-17"

  - module: "src/utils/settings-merge.ts"
    risk: "OpenCode plugin is fully replaced on every merge, not additively merged"
    mitigation: |
      Unlike Claude/Cursor where settings are additively merged, the OpenCode plugin
      file (.opencode/plugins/buildforce-explorer-redirect.ts) is fully overwritten
      on each init/upgrade. If users customize this file, changes WILL be lost.
      This is intentional since the plugin is single-purpose, but document for users.
    occurrences: 0
    last_flagged: "2026-02-19"

  - module: "src/templates/hooks/**/*"
    risk: "Per-agent hook API differences may cause subtle breakage"
    mitigation: |
      Claude, Cursor, and OpenCode each have different hook APIs:
      - Claude: "Explore" (capital E), updatedInput (camelCase), hookSpecificOutput
      - Cursor: "explore" (lowercase e), updated_input (snake_case), decision
      - OpenCode: "Explore" (capital E), in-place mutation, plugin API

      When modifying hook logic, ensure ALL three hook scripts are updated
      consistently. A change to one must be verified against the other two.
      The casing difference (Explore vs explore) is especially error-prone.
    occurrences: 0
    last_flagged: "2026-02-19"

  - module: "src/utils/settings-merge.ts"
    risk: "jq dependency not validated before hook execution"
    mitigation: |
      Claude and Cursor hook scripts depend on jq for JSON processing.
      If jq is not installed, hooks fail silently (no output, exit 0 = no rewrite).
      The buildforce check command does NOT verify jq installation.
      Consider adding jq to the check command's tool verification list.
    occurrences: 0
    last_flagged: "2026-02-19"

  - module: ".buildforce/context/_index.yaml"
    risk: "context-add skill may leave _index.yaml in inconsistent state"
    mitigation: |
      The context-add skill (Step 5 + Step 6) performs two writes: the context file
      and the _index.yaml update. If the skill is interrupted between these steps,
      the context file exists but _index.yaml does not reference it (orphaned file),
      or _index.yaml references a file that was not written (dangling reference).

      Additionally, summary.total_items is manually incremented -- if context-add
      runs concurrently or is interrupted, the count may drift from actual item count.

      Mitigations:
      - Run /context-extract to reconcile _index.yaml with actual files
      - Manually verify _index.yaml item count matches file count
      - The duplicate detection in Step 2 helps prevent double-adds on retry
    occurrences: 0
    last_flagged: "2026-02-19"

  - module: ".github/workflows/scripts/create-release-packages.sh"
    risk: "Agents invoke shell script directly instead of using npm scripts"
    mitigation: |
      Agents repeatedly try to create release packages by setting env vars
      and running the shell script directly. This NEVER works.

      CORRECT approach (always use npm scripts):
        npm run build && npm run create-release-packages && node ./dist/cli.js upgrade --local
        npm run build && npm run create-release-packages && node ./dist/cli.js init . --local

      WRONG approach (never do this):
        .github/workflows/scripts/create-release-packages.sh [any args]

      The npm "create-release-packages" script wraps the shell script with
      the correct version argument (v0.0.100) automatically.
      See: verification/release-package-verification.yaml for full details.
    occurrences: 3
    last_flagged: "2026-02-19"
