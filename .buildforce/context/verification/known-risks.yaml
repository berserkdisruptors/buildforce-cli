id: known-risks
name: Known Risks
type: verification
source: extracted
created: "2026-02-02"
last_updated: "2026-02-20"

quality_standards:
  - standard: "Risk awareness documentation"
    description: |
      This file documents known risks, gaps, and areas requiring extra attention.
      Agents should reference this before making changes to affected modules.
    enforcement: reference
    confidence: 1.0

known_risks:
  - module: "src/**/*.ts"
    risk: "Test coverage is at baseline thresholds (30%)"
    mitigation: |
      Automated testing exists but coverage thresholds are intentionally set low
      (30% statements/functions/lines, 25% branches) as the test suite is new.
      Areas with good coverage: utilities, migrations, settings-merge.
      Areas with limited coverage: command orchestrators, library functions.
      When making changes to under-covered areas:
      1. Run `npm run test:coverage` to check current coverage
      2. Add tests for new functionality
      3. Run `npm run build` to verify TypeScript compilation
    occurrences: 0
    last_flagged: "2026-02-20"

  - module: "src/**/*.ts"
    risk: "No linting enforcement"
    mitigation: |
      No ESLint or Prettier configuration at project level.
      Code style consistency relies on TypeScript strict mode and manual review.
      Consider running IDE-level linting during development.
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: ".github/workflows/release.yml"
    risk: "Automatic release on main branch pushes"
    mitigation: |
      Merging to main automatically creates a new release if key paths are modified.
      This is intentional for rapid iteration but means:
      - Every merge should be release-ready
      - Version bumping is automatic (patch increment)
      - Breaking changes require manual version management
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: "src/commands/**/*.ts"
    risk: "No error boundary or crash reporting"
    mitigation: |
      CLI commands may fail without helpful error messages in edge cases.
      When encountering errors, check:
      - File permissions
      - Network connectivity (for GitHub operations)
      - Valid project structure
    occurrences: 0
    last_flagged: "2026-02-02"

  - module: "src/commands/upgrade/migrations/**/*.ts"
    risk: "Forward-only migrations with no rollback support"
    mitigation: |
      Migration system is intentionally forward-only (no rollback).
      Key behaviors to understand:
      1. MigrationRunner stops on FIRST failure (runner.ts:135)
      2. Partial migrations can occur if a migration fails mid-way
      3. Failed migrations leave files in intermediate state
      4. Re-running upgrade will skip already-applied migrations (version check)
      
      When troubleshooting failed migrations:
      - Check _index.yaml version field for current state
      - Review error messages in upgrade output
      - Manual cleanup may be needed for partially-migrated content
      - Consider backup before running migrations on production context
    occurrences: 0
    last_flagged: "2026-02-17"

  - module: "src/commands/upgrade/execution.ts"
    risk: "Migration failures are non-blocking (graceful degradation)"
    mitigation: |
      Context migration errors do NOT fail the upgrade command.
      See execution.ts:421-427 - errors are logged but upgrade continues.
      
      This means:
      - Agent/skill files update even if context migration fails
      - Users may have mismatched versions between agents and context
      - Always check migration step output for "skipped" or warnings
      
      This is INTENTIONAL design: better to have updated agents with
      old context than to block critical security/feature updates.
    occurrences: 0
    last_flagged: "2026-02-17"

  - module: "src/commands/upgrade/migrations/*.ts"
    risk: "Migration code now has automated test coverage but remains high-risk"
    mitigation: |
      Migrations have comprehensive test coverage at unit and integration levels:
      - Unit: runner.test.ts, migrations-index.test.ts, migrations-v20-helpers.test.ts
      - Integration: v20-migration.test.ts, v21-migration.test.ts, runner-full.test.ts

      These tests cover version detection, skip behavior, error handling,
      full migration paths (v1.0 → v2.0 → v2.1), and idempotency.

      Risk remains elevated because migrations modify user context files permanently.
      Before modifying migration code, ensure:
      1. Existing migration tests still pass (npm run test:integration)
      2. Add new tests for any new migration logic
      3. Test re-running migrations on already-migrated content
    occurrences: 0
    last_flagged: "2026-02-20"
