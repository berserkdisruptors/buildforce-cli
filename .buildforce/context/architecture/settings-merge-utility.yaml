id: settings-merge-utility
name: Settings Merge Utility
type: structural
status: production
created: "2026-02-04"
last_updated: "2026-02-13"

summary: |
  Unified TypeScript utility for merging agent settings from template configuration into
  the agent's settings.local.json file. Agent-agnostic API (mergeAgentSettings) that
  accepts agentFolder parameter. For Claude agents, also merges hard-coded Buildforce
  hooks (PreToolUse hook for Explore→buildforce-explorer redirection) and ensures hook
  scripts are executable. Uses additive deep-merge strategy that preserves all existing
  user permissions and hooks while adding new entries from templates. Deduplicates arrays
  using JSON.stringify comparison to ensure idempotent operations across multiple
  init/upgrade cycles. Consolidates the former hooks.ts utility into a single file.

responsibilities:
  - Merge template hooks/config.json into agent's settings.local.json
  - Conditionally merge hard-coded Buildforce hooks for Claude agents (PreToolUse hook)
  - Ensure hook scripts are executable after writing (Claude-only, chmod .sh files)
  - Preserve existing user permissions (allow, deny, ask arrays)
  - Preserve existing user hooks (Stop, PreToolUse, PostToolUse arrays)
  - Deduplicate array entries using JSON.stringify comparison
  - Create settings.local.json if it doesn't exist
  - Handle edge cases gracefully (missing template, malformed JSON)
  - Provide debug logging when enabled
  - Return detailed merge result for progress tracking

dependencies:
  internal:
    - init-command: "Calls mergeAgentSettings after template extraction"
    - upgrade-command: "Calls mergeAgentSettings after template replacement"
  external:
    - fs-extra: "^11.2.0 - File system operations (readFile, writeFile, pathExists, ensureDir)"
    - chalk: "^5.4.1 - Debug logging with colored output"

files:
  primary:
    - src/utils/settings-merge.ts
  secondary:
    - src/commands/init/setup.ts
    - src/commands/upgrade/execution.ts

interfaces:
  exports:
    - name: "mergeAgentSettings"
      signature: "(projectPath: string, agentFolder: string, templateConfigPath: string, options?: { debug?: boolean }) => Promise<MergeResult>"
      description: "Merges template config into agent's settings.local.json. For Claude, also merges hard-coded Buildforce hooks and ensures hook scripts are executable."

    - name: "MergeResult"
      signature: "interface { merged: boolean; skipped: boolean; reason: string; hooksAdded?: number; permissionsAdded?: number }"
      description: "Result object describing what was done during merge"

design_decisions:
  - decision: "Use additive-only merge strategy (never removes existing data)"
    rationale: "User permissions and hooks represent accumulated approvals and customizations. Removing them would break workflows and require re-approval. Safety over cleanup."

  - decision: "Deduplicate arrays using JSON.stringify comparison"
    rationale: "Simple and reliable for comparing hook objects. Multiple upgrade cycles shouldn't add duplicate hooks. Performance is acceptable since arrays are small."

  - decision: "Template config contains hooks content directly, not full settings structure"
    rationale: "Keeps template file focused on what Buildforce needs (hooks). The utility wraps it in settings structure for merging. Separation of concerns."

  - decision: "Skip merge gracefully if template config doesn't exist"
    rationale: "Not all releases may include hooks. Graceful degradation prevents upgrade failures when hooks aren't needed."

  - decision: "No backup file creation"
    rationale: "Merge is additive-only and git tracks changes. Backup adds complexity without significant value since no data is lost."

merge_algorithm: |
  1. Read template config from .buildforce/templates/hooks/config.json
     - Template contains hooks content directly: { "Stop": [...], "PreToolUse": [...] }
     - Wrap in settings structure: { hooks: templateContent }

  2. Read existing settings from {agentFolder}/settings.local.json
     - If file doesn't exist: start with empty object {}
     - If file is malformed: log warning, start with empty object {}

  3. Merge template config into existing settings (additive):
     - permissions.allow/deny/ask: concat arrays, deduplicate
     - hooks.*: concat arrays, deduplicate

  4. If agentFolder === ".claude/": merge hard-coded Buildforce hooks
     - BUILDFORCE_HOOKS_CONFIG contains PreToolUse hook for Task tool redirection
     - Same additive merge with deduplication

  5. Write merged result to {agentFolder}/settings.local.json
     - Pretty-print with 2-space indent
     - Add trailing newline

  6. If agentFolder === ".claude/": ensure hook scripts are executable
     - chmod +x all .sh files in {agentFolder}/hooks/

data_models:
  - name: "ClaudeSettings"
    description: "Claude Code settings file structure"
    properties:
      - name: permissions
        type: "{ allow?: string[], deny?: string[], ask?: string[] }"
        description: "Tool permission rules"
      - name: hooks
        type: "{ Stop?: unknown[], PreToolUse?: unknown[], PostToolUse?: unknown[] }"
        description: "Event hook configurations"

  - name: "MergeResult"
    description: "Result returned by mergeClaudeSettings"
    properties:
      - name: merged
        type: boolean
        description: "True if merge was performed"
      - name: skipped
        type: boolean
        description: "True if merge was skipped"
      - name: reason
        type: string
        description: "Explanation of what happened"
      - name: hooksAdded
        type: number
        description: "Count of hooks in template config"
      - name: permissionsAdded
        type: number
        description: "Count of permissions in template config"

evolution:
  - version: "1.0"
    date: "2026-02-04"
    changes: "Initial implementation with additive deep-merge, array deduplication, and graceful edge case handling"

  - version: "2.0"
    date: "2026-02-13"
    changes: "Unified mergeAgentSettings API (agent-agnostic signature with agentFolder param). Consolidated hooks.ts into settings-merge.ts. Added hard-coded Buildforce hooks merge and ensureHooksExecutable for Claude agents."

related_specs:
  - skills-bundling-config-concat-20260204000000

notes: |
  This utility enables configuration of Buildforce features by merging
  template settings into agent's settings.local.json. Consolidated from
  two separate files (settings-merge.ts + hooks.ts) into a single
  agent-agnostic utility.

  The merge is designed to be:
  - Safe: Never removes user data
  - Idempotent: Multiple runs don't create duplicates
  - Transparent: Debug logging shows what was done
  - Resilient: Graceful handling of missing/malformed files
  - Agent-agnostic: Works with any agent folder via agentFolder parameter

  Claude-specific behavior (agentFolder === ".claude/"):
  - Merges hard-coded BUILDFORCE_HOOKS_CONFIG (PreToolUse hook for Explore redirect)
  - Ensures .sh files in hooks directory are executable (chmod)
