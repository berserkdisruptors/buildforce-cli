id: settings-merge-utility
name: Settings Merge Utility
type: structural
status: production
created: "2026-02-04"
last_updated: "2026-02-16"

summary: |
  Unified TypeScript utility for merging agent settings into agent-specific configuration
  files. Agent-agnostic API (mergeAgentSettings) dispatches to per-agent strategies:
  - Claude: Merges PreToolUse hooks into .claude/settings.local.json, ensures .sh executability
  - Cursor: Merges preToolUse hooks into .cursor/hooks.json
  - OpenCode: Writes explorer redirect plugin to .opencode/plugins/

  Uses additive deep-merge strategy that preserves all existing user permissions and hooks
  while adding new entries. Deduplicates arrays using JSON.stringify comparison to ensure
  idempotent operations across multiple init/upgrade cycles. Hard-coded hook configurations
  per agent (no template config.json dependency for Claude and Cursor).

responsibilities:
  - Dispatch to agent-specific merge strategy based on agentFolder parameter
  - Claude: Merge hard-coded CLAUDE_HOOKS_CONFIG (PreToolUse) into .claude/settings.local.json
  - Cursor: Merge hard-coded CURSOR_HOOKS_CONFIG (preToolUse) into .cursor/hooks.json
  - OpenCode: Write explorer redirect plugin to .opencode/plugins/buildforce-explorer-redirect.ts
  - Ensure hook scripts are executable after writing (chmod .sh files in hooks directory)
  - Preserve existing user permissions (allow, deny, ask arrays) via additive merge
  - Preserve existing user hooks (Stop, PreToolUse, PostToolUse arrays) via additive merge
  - Deduplicate array entries using JSON.stringify comparison
  - Create settings files if they don't exist
  - Handle edge cases gracefully (malformed JSON)
  - Provide debug logging when enabled
  - Return detailed MergeResult for progress tracking

dependencies:
  internal:
    - init-command: "Calls mergeAgentSettings after template extraction"
    - upgrade-command: "Calls mergeAgentSettings after template replacement"
  external:
    - fs-extra: "^11.2.0 - File system operations (readFile, writeFile, pathExists, ensureDir)"
    - chalk: "^5.4.1 - Debug logging with colored output"

files:
  primary:
    - src/utils/settings-merge.ts
  secondary:
    - src/commands/init/setup.ts
    - src/commands/upgrade/execution.ts

interfaces:
  exports:
    - name: "mergeAgentSettings"
      signature: "(projectPath: string, agentFolder: string, options?: { debug?: boolean }) => Promise<MergeResult>"
      description: "Dispatches to agent-specific merge strategy. Claude: settings.local.json + hooks chmod. Cursor: hooks.json. OpenCode: plugins/buildforce-explorer-redirect.ts."

    - name: "MergeResult"
      signature: "interface { merged: boolean; skipped: boolean; reason: string; hooksAdded?: number; permissionsAdded?: number }"
      description: "Result object describing what was done during merge"

design_decisions:
  - decision: "Use additive-only merge strategy (never removes existing data)"
    rationale: "User permissions and hooks represent accumulated approvals and customizations. Removing them would break workflows and require re-approval. Safety over cleanup."

  - decision: "Deduplicate arrays using JSON.stringify comparison"
    rationale: "Simple and reliable for comparing hook objects. Multiple upgrade cycles shouldn't add duplicate hooks. Performance is acceptable since arrays are small."

  - decision: "Template config contains hooks content directly, not full settings structure"
    rationale: "Keeps template file focused on what Buildforce needs (hooks). The utility wraps it in settings structure for merging. Separation of concerns."

  - decision: "Skip merge gracefully if template config doesn't exist"
    rationale: "Not all releases may include hooks. Graceful degradation prevents upgrade failures when hooks aren't needed."

  - decision: "No backup file creation"
    rationale: "Merge is additive-only and git tracks changes. Backup adds complexity without significant value since no data is lost."

merge_algorithm: |
  The mergeAgentSettings() function dispatches to agent-specific strategies:

  CLAUDE (.claude/):
  1. Read existing .claude/settings.local.json (or start with {})
  2. Merge hard-coded CLAUDE_HOOKS_CONFIG (PreToolUse hook for Task → buildforce-explorer)
  3. Write merged result to .claude/settings.local.json
  4. Ensure all .sh files in .claude/hooks/ are executable (chmod +x)

  CURSOR (.cursor/):
  1. Read existing .cursor/hooks.json (or start with {})
  2. Merge hard-coded CURSOR_HOOKS_CONFIG (preToolUse hook for Task → buildforce-explorer)
  3. Write merged result to .cursor/hooks.json
  4. Ensure all .sh files in .cursor/hooks/ are executable (chmod +x)

  OPENCODE (.opencode/):
  1. Create .opencode/plugins/ directory
  2. Write buildforce-explorer-redirect.ts plugin (full replacement, not merge)
  3. Plugin intercepts task tool calls with subagent_type "Explore"

  Shared merge logic (mergeJsonSettingsFile):
  - Read existing JSON file (or start with {})
  - Additive merge: concat arrays with deduplication (JSON.stringify comparison)
  - Write with 2-space indent + trailing newline

data_models:
  - name: "ClaudeSettings"
    description: "Claude Code settings file structure"
    properties:
      - name: permissions
        type: "{ allow?: string[], deny?: string[], ask?: string[] }"
        description: "Tool permission rules"
      - name: hooks
        type: "{ Stop?: unknown[], PreToolUse?: unknown[], PostToolUse?: unknown[] }"
        description: "Event hook configurations"

  - name: "MergeResult"
    description: "Result returned by mergeClaudeSettings"
    properties:
      - name: merged
        type: boolean
        description: "True if merge was performed"
      - name: skipped
        type: boolean
        description: "True if merge was skipped"
      - name: reason
        type: string
        description: "Explanation of what happened"
      - name: hooksAdded
        type: number
        description: "Count of hooks in template config"
      - name: permissionsAdded
        type: number
        description: "Count of permissions in template config"

evolution:
  - version: "1.0"
    date: "2026-02-04"
    changes: "Initial implementation with additive deep-merge, array deduplication, and graceful edge case handling"

  - version: "2.0"
    date: "2026-02-13"
    changes: "Unified mergeAgentSettings API (agent-agnostic signature with agentFolder param). Consolidated hooks.ts into settings-merge.ts. Added hard-coded Buildforce hooks merge and ensureHooksExecutable for Claude agents."

  - version: "3.0"
    date: "2026-02-16"
    changes: |
      Full multi-agent support. Added mergeCursorSettings (hooks.json), mergeOpenCodeSettings
      (plugin file). All hook configs are now hard-coded per agent (CLAUDE_HOOKS_CONFIG,
      CURSOR_HOOKS_CONFIG) instead of reading from template config.json. Removed template
      config file dependency. Each agent strategy handles its own settings file format.

related_specs:
  - skills-bundling-config-concat-20260204000000

notes: |
  This utility enables configuration of Buildforce features by merging
  hook configurations into agent-specific settings files.

  The merge is designed to be:
  - Safe: Never removes user data (additive only)
  - Idempotent: Multiple runs don't create duplicates
  - Transparent: Debug logging shows what was done
  - Resilient: Graceful handling of missing/malformed files
  - Agent-agnostic: Works with any agent folder via agentFolder parameter

  Agent-specific behaviors:
  - Claude (.claude/): Merges CLAUDE_HOOKS_CONFIG into settings.local.json, chmod hooks
  - Cursor (.cursor/): Merges CURSOR_HOOKS_CONFIG into hooks.json, chmod hooks
  - OpenCode (.opencode/): Writes plugin file to plugins/ directory
  - Unknown agent: Returns { merged: false, skipped: true, reason: "unknown agent" }
